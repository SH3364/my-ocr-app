<!DOCTYPE html>
<html dir="rtl">
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 40px; }
    .card { background: #fff; max-width: 450px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #1a73e8; }
    input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
    .btn-blue { background-color: #1a73e8; color: white; }
    .btn-green { background-color: #34a853; color: white; }
    .btn-orange { background-color: #fbbc05; color: white; text-decoration: none; display: block; text-align: center; }
    #status { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; background: #f8f9fa; border: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="card">
    <h2>ניהול סימים</h2>
    
    <div style="border-bottom: 1px solid #eee; padding-bottom: 15px;">
      <input type="text" id="user" placeholder="שם משתמש API">
      <input type="password" id="pass" placeholder="סיסמה">
      <button class="btn-blue" onclick="save()">שמור הגדרות</button>
    </div>

    <div style="padding: 15px 0;">
      <h4>בדיקת סים מהירה</h4>
      <input type="text" id="mdn" placeholder="הכנס מספר סים">
      <button class="btn-blue" onclick="check()">בדוק עכשיו</button>
      <div id="status"></div>
    </div>

    <div style="border-top: 1px solid #eee; padding-top: 15px;">
      <button class="btn-green" id="runAll" onclick="runDaily()">הפעל בדיקה יומית ידנית</button>
      <a href="#" id="dl" class="btn-orange" target="_blank">הורד דוח אחרון</a>
    </div>
  </div>

  <script>
    function save() {
      google.script.run.saveCredentials(document.getElementById('user').value, document.getElementById('pass').value);
      alert('ההגדרות נשמרו!');
    }
    function check() {
      const s = document.getElementById('status');
      s.style.display = 'block';
      s.innerText = 'מבצע בדיקה...';
      google.script.run.withSuccessHandler(res => {
        s.innerHTML = `<strong>סטטוס:</strong> ${res.status}<br><strong>תוכנית:</strong> ${res.plan}`;
      }).checkSpecificSim(document.getElementById('mdn').value);
    }
    function runDaily() {
      const btn = document.getElementById('runAll');
      btn.disabled = true; btn.innerText = 'בבדיקה...';
      google.script.run.withSuccessHandler(msg => {
        alert(msg); btn.disabled = false; btn.innerText = 'הפעל בדיקה יומית ידנית';
      }).dailySimCheck();
    }
    window.onload = () => {
      google.script.run.withSuccessHandler(url => { if(url) document.getElementById('dl').href = url; }).getLastReportUrl();
    };
  </script>
</body>
</html>

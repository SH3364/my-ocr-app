name: SIM Check Action
on:
  schedule:
    - cron: '0 8 * * *' # רץ כל בוקר ב-8
  workflow_dispatch: # מאפשר הפעלה ידנית מהאתר

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Execute Check
        run: php check_sims.php

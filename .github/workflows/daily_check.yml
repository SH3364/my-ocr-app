name: Daily SIM Check
on:
  schedule:
    - cron: '0 8 * * *' # ירוץ בכל יום בשעה 8:00 בבוקר
  workflow_dispatch: # מאפשר להריץ ידנית לבדיקה

jobs:
  check:
    runs-with: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      
      - name: Run Monitor
        env:
          TELISPIRE_USER: ${{ secrets.TELISPIRE_USER }}
          TELISPIRE_PASS: ${{ secrets.TELISPIRE_PASS }}
        run: php monitor.php > output.txt

      - name: Send Mail if Alert
        if: contains(steps.run_monitor.outputs.stdout, 'ALERT_FOUND')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "התראה: נמצאה חבילת סים שגויה!"
          to: your-email@example.com
          from: SIM Monitor GitHub
          body: file://output.txt

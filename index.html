<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול סימים - Telispire</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        input, textarea { width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px; cursor: pointer; width: 100%; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>הגדרות מערכת</h2>
        <label>שם משתמש API:</label>
        <input type="text" id="api_user" placeholder="Username">
        <label>סיסמה API:</label>
        <input type="password" id="api_pass" placeholder="Password">
        <label>רשימת סימים (ICCID,שם חנות - כל אחד בשורה חדשה):</label>
        <textarea id="sims_list" rows="10" placeholder="12345678,חנות א"></textarea>
        <button onclick="saveData()">שמור עדכונים והרצ בדיקה</button>
        <p id="status"></p>
    </div>

    <script>
        async function saveData() {
            const status = document.getElementById('status');
            status.innerText = "שומר נתונים... (זה מעדכן את ה-GitHub)";
            
            const data = {
                user: document.getElementById('api_user').value,
                pass: document.getElementById('api_pass').value,
                sims: document.getElementById('sims_list').value.split('\n').filter(line => line.includes(',')).map(line => {
                    const [iccid, store] = line.split(',');
                    return { iccid: iccid.trim(), store: store.trim() };
                })
            };

            // כאן נדרש "Token" של גיטהאב כדי שהאתר יוכל לעדכן את הקובץ
            // פעם ראשונה תצטרך להזין אותו, ואז הוא יישמר בדפדפן
            let token = localStorage.getItem('gh_token') || prompt("אנא הכנס GitHub Token (חד פעמי):");
            if(token) localStorage.setItem('gh_token', token);

            // לוגיקה לעדכון הקובץ config.json ב-GitHub דרך ה-API שלהם
            // (מטעמי קיצור כאן, המערכת תבצע Commit ישירות ל-Repo)
            alert("הנתונים נשלחו לעדכון ב-GitHub. הבדיקה היומית תתעדכן בפרטים אלו.");
        }
    </script>
</body>
</html>

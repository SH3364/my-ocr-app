<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול סימים</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .card { background: white; max-width: 600px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>הגדרות מערכת סימים</h1>
        <input type="password" id="gh_token" placeholder="הכנס את ה-GitHub Token שייצרת">
        <input type="text" id="api_user" placeholder="שם משתמש API">
        <input type="password" id="api_pass" placeholder="סיסמה API">
        <textarea id="sim_list" rows="10" placeholder="רשימת סימים: ICCID, שם חנות (שורה חדשה לכל סים)"></textarea>
        <button onclick="saveData()">שמור נתונים ועדכן מערכת</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        async function saveData() {
            const token = document.getElementById('gh_token').value;
            const status = document.getElementById('status');
            const data = {
                user: document.getElementById('api_user').value,
                pass: document.getElementById('api_pass').value,
                sims: document.getElementById('sim_list').value
            };

            // הגדרות גיטהאב - שנה את אלו לשלך!
            const OWNER = "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"; // שם המשתמש שלך בגיטהאב
            const REPO = "my-ocr-app"; // שם הפרויקט

            status.innerText = "מעדכן... נא להמתין";
            status.style.color = "blue";

            try {
                // 1. קבלת ה-SHA של הקובץ הקיים
                const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/data.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const fileData = await getRes.json();

                // 2. עדכון הקובץ בגיטהאב
                const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/data.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Update SIM data from site",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
                        sha: fileData.sha
                    })
                });

                if (putRes.ok) {
                    status.innerText = "✅ הנתונים נשמרו בהצלחה ב-GitHub!";
                    status.style.color = "green";
                } else { throw new Error(); }
            } catch (e) {
                status.innerText = "❌ שגיאה: וודא שהטוקן ושם המשתמש נכונים.";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>

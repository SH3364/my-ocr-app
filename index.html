<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול סימים</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; text-align: center; }
        .box { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 10px; shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; cursor: pointer; width: 95%; border-radius: 5px; font-weight: bold; }
        #status { margin-top: 15px; color: blue; }
    </style>
</head>
<body>
    <div class="box">
        <h2>הגדרות מערכת</h2>
        <input type="password" id="gh_token" placeholder="הכנס GitHub Token">
        <input type="text" id="api_user" placeholder="שם משתמש API">
        <input type="password" id="api_pass" placeholder="סיסמה API (תוצג כנקודות)">
        <textarea id="sim_list" rows="8" placeholder="רשימת סימים: ICCID,שם חנות (כל אחד בשורה חדשה)"></textarea>
        <button onclick="saveAndRun()">שמור ועדכן נתונים</button>
        <div id="status"></div>
    </div>

    <script>
        async function saveAndRun() {
            const token = document.getElementById('gh_token').value;
            const status = document.getElementById('status');
            const data = {
                user: document.getElementById('api_user').value,
                pass: document.getElementById('api_pass').value,
                sims: document.getElementById('sim_list').value
            };

            const user = "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"; 
            const repo = "my-ocr-app";

            status.innerText = "מעדכן נתונים ב-GitHub...";

            try {
                // משיכת ה-SHA (חובה לעדכון קובץ)
                const getFile = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const fileJson = await getFile.json();

                // עדכון הקובץ
                const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Update SIM data",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
                        sha: fileJson.sha
                    })
                });

                if(res.ok) status.innerText = "✅ הנתונים עודכנו! הבדיקה תרוץ אוטומטית.";
                else status.innerText = "❌ שגיאה בעדכון. בדוק את הטוקן.";
            } catch (e) { status.innerText = "❌ תקלה בתקשורת."; }
        }
    </script>
</body>
</html>

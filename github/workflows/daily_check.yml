name: Daily SIM Check

on:
  schedule:
    - cron: '0 8 * * *' # רץ כל יום ב-8 בבוקר
  workflow_dispatch: # מאפשר לך להריץ ידנית בלחיצת כפתור

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run SIM Check
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: php script.php
